name: Custom Bundle Build

on:
  repository_dispatch:
    types: [custom-bundle-request]
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated app IDs to build'
        required: true
        default: 'youtube,youtube_music,microg'
      arch:
        description: 'Target architecture'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - x86_64
          - armeabi-v7a

permissions:
  contents: write

jobs:
  custom-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Download CLI Binary
        run: |
          mkdir -p bin
          CLI_URL="https://github.com/${{ github.repository }}/releases/latest/download/revancex-linux-x86_64.tar.gz"
          if ! curl -sSLf "$CLI_URL" | tar -xz -C bin/; then
            echo "Direct latest fetch failed, resolving release tag via API..."
            CLI_TAG=$(curl -sSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/releases" | jq -r '[.[] | select(.assets[]?.name == "revancex-linux-x86_64.tar.gz")][0].tag_name // "v1.0.3"')
            curl -sSLf "https://github.com/${{ github.repository }}/releases/download/${CLI_TAG}/revancex-linux-x86_64.tar.gz" | tar -xz -C bin/
          fi
          chmod +x bin/revancex*
          echo "$PWD/bin" >> $GITHUB_PATH
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install download accelerator (aria2)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq aria2

      - name: Resolve inputs (dispatch vs manual)
        id: inputs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "apps=${{ github.event.client_payload.apps }}" >> $GITHUB_OUTPUT
            echo "arch=${{ github.event.client_payload.arch }}" >> $GITHUB_OUTPUT
          else
            echo "apps=${{ inputs.apps }}" >> $GITHUB_OUTPUT
            echo "arch=${{ inputs.arch }}" >> $GITHUB_OUTPUT
          fi

      - name: Resolve Metadata
        id: meta
        run: |
          CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          DATE_STR=$(date -u +'%Y.%m.%d')
          TAG="custom-v${CARGO_VER}-${DATE_STR}-b${{ github.run_number }}"
          TITLE="Custom Bundle — ${{ steps.inputs.outputs.apps }} (${DATE_STR})"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "version=$CARGO_VER" >> $GITHUB_OUTPUT
          echo "date=$DATE_STR" >> $GITHUB_OUTPUT

      - name: Download tools
        run: revancex download-tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build selected apps
        run: |
          mkdir -p output
          revancex build \
            --apps "${{ steps.inputs.outputs.apps }}" \
            --arch "${{ steps.inputs.outputs.arch }}"
          revancex module \
            --bundle \
            --apps "${{ steps.inputs.outputs.apps }}" \
            --include-webui \
            --output output || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Verify and cap asset sizes for release upload
        run: |
          for f in output/*; do
            [ -f "$f" ] || continue
            fsize=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null || echo 0)
            if [ "$fsize" -gt 2000000000 ]; then
              echo "Warning: $f exceeds 2GB ($fsize bytes), removing before release upload to prevent failure"
              rm -f "$f"
            fi
          done

      - name: Create custom release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: |
            Custom bundle requested via GitHub Pages.
            - **Apps**: ${{ steps.inputs.outputs.apps }}
            - **Arch**: ${{ steps.inputs.outputs.arch }}
            - **CLI Version**: `v${{ steps.meta.outputs.version }}`
            - **Date**: ${{ steps.meta.outputs.date }}
          files: |
            output/*.apk
            output/*.zip
          fail_on_unmatched_files: false
          make_latest: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README tables and send Telegram notification
        run: |
          python3 scripts/update_readme_and_notify.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          OUTPUT_DIR: output
          TG_CHAT: ${{ secrets.TG_CHAT || secrets.TELEGRAM_CHAT_ID }}
          TG_TOKEN: ${{ secrets.TG_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_TOPIC: ${{ secrets.TG_TOPIC || secrets.TG_THREAD_ID || secrets.TELEGRAM_TOPIC_ID }}

      - name: Commit and push updated README & release registry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md config/releases_registry.json
          git commit -m "docs: update custom bundle registry for ${{ steps.meta.outputs.tag }} [skip ci]" || echo "No changes to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref }} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
