name: Build Modules
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5.2.0
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          submodules: true

      - name: Update config
        if: ${{ inputs.from_ci }}
        run: |
          if git checkout origin/update build.md; then
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ "$UPDATE_CFG" ]; then
              echo "$UPDATE_CFG" > config.json
            fi
          fi

      - name: Get next version code
        id: next_ver_code
        run: |
          echo "NEXT_VER_CODE=$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Build modules/APKs
        run: if [ -f "config.json" ]; then ./build.sh config.json; else ./build.sh config.toml; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}

      - name: Get output
        id: get_output
        run: |
          echo "DATE=$(date +%y.%m.%d)" >> "$GITHUB_OUTPUT"
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp

      - name: Get Date
        id: date
        run: |
          echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Upload modules to release
        uses: svenstaro/upload-release-action@2.11.3
        with:
          body: ${{ steps.get_output.outputs.BUILD_LOG }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./build/*
          release_name: ReVanced eXtended v${{ steps.get_output.outputs.DATE }}
          tag: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          file_glob: true
          overwrite: true
          prerelease: false
          make_latest: true

      - name: Update changelog and Magisk update json
        id: update_config
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md\"
          }"
          }

          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *magisk*.zip; do
            [ "$OUTPUT" = "*magisk*.zip" ] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            get_update_json "$VER" "$DLURL" >"../$UPDATE_JSON"
          done
          cd ..

          find . -name "*-update.json" | grep . || : >dummy-update.json

      - name: Report to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        if: env.TG_TOKEN != null
        run: |
          cd build || { echo "build folder not found"; exit 1; }

          NL=$'\n'
          APKS=""
          MODULES=""
          CHAT_ID=${CHAT_ID}
          for OUTPUT in *; do
            DL_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            if [[ $OUTPUT = *.apk ]]; then
              APKS+="${NL}📦[${OUTPUT}](${DL_URL})"
            elif [[ $OUTPUT = *.zip ]]; then
              MODULES+="${NL}📦[${OUTPUT}](${DL_URL})"
            fi
          done
          MODULES=${MODULES#"$NL"}
          APKS=${APKS#"$NL"}

          BODY="$(sed 's/^\* \*\*/→ \*\*/g; s/^\* `/→ \*\*/g; s/`/\*/g; s/^\* /→ /g; s/\*\*/\*/g; s/###//g; s/^- /→ /g; /^==/d; s/^## /\n📋 /g; s/^### /\n🔹 /g;' ../build.md)"
          MSG="🎉 *ReVanced Extended - New Build Available!*
          
          ${BODY}
          
          ━━━━━━━━━━━━━━━━━
          📥 *Download Links* [arm64-v8a]
          
          *📦 Magisk Modules:*
          ${MODULES}
          
          *📱 APK Files:*
          ${APKS}
          
          ━━━━━━━━━━━━━━━━━
          💡 *Need Help?* Join our [Support Group](https://t.me/thunderkexSupport)"
          
          MSG=${MSG:0:9450}
          POST="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          curl -X POST --data-urlencode "parse_mode=Markdown" --data-urlencode "disable_web_page_preview=true" --data-urlencode "text=${MSG}" --data-urlencode "message_thread_id=26772" --data-urlencode "chat_id=${CHAT_ID}" "$POST"

      - name: Update README with download links
        env:
          RELEASE_TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
        run: |
          cd build || exit 1
          
          # Initialize category arrays
          declare -A YOUTUBE_APPS MUSIC_APPS SOCIAL_APPS MEDIA_APPS PHOTO_APPS
          declare -A BUILT_APPS
          
          # Map app names to display names
          get_display_name() {
            case "$1" in
              youtube-ex-revanced) echo "YouTube Extended" ;;
              youtube-ex-dev) echo "YouTube Extended Dev" ;;
              youtube-ex-morphed) echo "YouTube Extended Morphed" ;;
              music-ex-revanced) echo "YouTube Music Extended" ;;
              music-ex-dev) echo "YouTube Music Extended Dev" ;;
              music-ex-morphed) echo "YouTube Music Morphed" ;;
              reddit-ex) echo "Reddit Extended" ;;
              facebook) echo "Facebook" ;;
              instagram) echo "Instagram" ;;
              spotify) echo "Spotify" ;;
              soundcloud) echo "SoundCloud" ;;
              gphotos) echo "Google Photos" ;;
              lightroom) echo "Lightroom" ;;
              x-piko) echo "X/Twitter (Piko)" ;;
              x-piko-dev) echo "X/Twitter (Piko Dev)" ;;
              tiktok) echo "TikTok" ;;
              *) echo "$1" ;;
            esac
          }
          
          # Extract existing links from README to preserve apps that weren't built
          extract_existing_links() {
            local category="$1"
            awk -v cat="$category" '
              BEGIN { in_section=0; in_table=0 }
              index($0, "### " cat) == 1 { in_section=1; next }
              in_section && /^\|/ && /App.*Magisk Module.*APK/ { in_table=1; next }
              in_section && in_table && /^\| \*\*/ {
                match($0, /\*\*([^*]+)\*\*/, app)
                match($0, /\.zip\)/, magisk_pos)
                match($0, /\.apk\)/, apk_pos)
                
                # Extract full URLs
                magisk_match = $0
                sub(/.*\]\(/, "", magisk_match)
                sub(/\.zip\).*/, ".zip", magisk_match)
                
                apk_match = $0
                sub(/.*\.zip\).*\]\(/, "", apk_match)
                sub(/\.apk\).*/, ".apk", apk_match)
                
                if (app[1] && magisk_match && apk_match) {
                  print app[1] "|" magisk_match "|" apk_match
                }
                next
              }
              in_section && /^###/ && in_table { exit }
              in_section && /^$/ { in_table=0 }
            ' ../README.md 2>/dev/null || true
          }
          
          # Load existing links for all categories
          {
            extract_existing_links "🎬 YouTube Apps"
            extract_existing_links "🎵 YouTube Music Apps"
            extract_existing_links "🐦 Social Media Apps"
            extract_existing_links "🎶 Music & Media Apps"
            extract_existing_links "📸 Photo & Creative Apps"
          } | while IFS='|' read -r app_name magisk_file apk_file; do
            [[ -z "$app_name" ]] && continue
            
            # Map display name back to basename
            case "$app_name" in
              "YouTube Extended") basename="youtube-ex-revanced" ;;
              "YouTube Extended Dev") basename="youtube-ex-dev" ;;
              "YouTube Extended Morphed") basename="youtube-ex-morphed" ;;
              "YouTube Music Extended") basename="music-ex-revanced" ;;
              "YouTube Music Extended Dev") basename="music-ex-dev" ;;
              "YouTube Music Morphed") basename="music-ex-morphed" ;;
              "Reddit Extended") basename="reddit-ex" ;;
              "Facebook") basename="facebook" ;;
              "Instagram") basename="instagram" ;;
              "Spotify") basename="spotify" ;;
              "SoundCloud") basename="soundcloud" ;;
              "Google Photos") basename="gphotos" ;;
              "Lightroom") basename="lightroom" ;;
              "X/Twitter (Piko)") basename="x-piko" ;;
              "X/Twitter (Piko Dev)") basename="x-piko-dev" ;;
              "TikTok") basename="tiktok" ;;
              *) continue ;;
            esac
            
            # Use the full URL as-is from README
            magisk_badge="[![Download](https://img.shields.io/badge/Download-Magisk-00C853?style=for-the-badge&logo=android)]($magisk_file)"
            apk_badge="[![Download](https://img.shields.io/badge/Download-APK-FF6F00?style=for-the-badge&logo=android)]($apk_file)"
            
            if [[ $basename == youtube-ex* ]]; then
              YOUTUBE_APPS["$basename"]="$magisk_badge|$apk_badge|"
            elif [[ $basename == music-ex* ]]; then
              MUSIC_APPS["$basename"]="$magisk_badge|$apk_badge|"
            elif [[ $basename == reddit-ex || $basename == facebook || $basename == instagram || $basename == x-piko* ]]; then
              SOCIAL_APPS["$basename"]="$magisk_badge|$apk_badge|"
            elif [[ $basename == spotify || $basename == soundcloud || $basename == tiktok ]]; then
              MEDIA_APPS["$basename"]="$magisk_badge|$apk_badge|"
            elif [[ $basename == gphotos || $basename == lightroom ]]; then
              PHOTO_APPS["$basename"]="$magisk_badge|$apk_badge|"
            fi
          done
          
          # Process all files that were actually built (this will override existing links)
          for OUTPUT in *.zip *.apk; do
            [ ! -f "$OUTPUT" ] && continue
            
            # Extract base name (remove -magisk, version, arch, extension)
            BASENAME=$(echo "$OUTPUT" | sed 's/-revanced-magisk.*//; s/-revanced.*//')
            DL_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/${RELEASE_TAG}/${OUTPUT}"
            DISPLAY_NAME=$(get_display_name "$BASENAME")
            
            # Categorize and store
            if [[ $OUTPUT == *.zip ]]; then
              BADGE="[![Download](https://img.shields.io/badge/Download-Magisk-00C853?style=for-the-badge&logo=android)]($DL_URL)"
            else
              BADGE="[![Download](https://img.shields.io/badge/Download-APK-FF6F00?style=for-the-badge&logo=android)]($DL_URL)"
            fi
            
            # Mark as newly built
            BUILT_APPS["$BASENAME"]=1
            
            # Add to appropriate category (only if both module and apk exist for that app)
            if [[ $BASENAME == youtube-ex* ]]; then
              YOUTUBE_APPS["$BASENAME"]+="$BADGE|"
            elif [[ $BASENAME == music-ex* ]]; then
              MUSIC_APPS["$BASENAME"]+="$BADGE|"
            elif [[ $BASENAME == reddit-ex || $BASENAME == facebook || $BASENAME == instagram || $BASENAME == x-piko* ]]; then
              SOCIAL_APPS["$BASENAME"]+="$BADGE|"
            elif [[ $BASENAME == spotify || $BASENAME == soundcloud || $BASENAME == tiktok ]]; then
              MEDIA_APPS["$BASENAME"]+="$BADGE|"
            elif [[ $BASENAME == gphotos || $BASENAME == lightroom ]]; then
              PHOTO_APPS["$BASENAME"]+="$BADGE|"
            fi
          done
          
          cd ..
          
          # Generate markdown sections (includes both newly built and preserved apps)
          {
            echo "<!-- DOWNLOAD_LINKS_START -->"
            echo "*📅 Last updated: $(date +'%Y-%m-%d %H:%M UTC') | Release: [${RELEASE_TAG}](https://github.com/$GITHUB_REPOSITORY/releases/tag/${RELEASE_TAG})*"
            echo ""
            
            # YouTube Apps
            if [ ${#YOUTUBE_APPS[@]} -gt 0 ]; then
              echo "### 🎬 YouTube Apps"
              echo "| App | 📦 Magisk Module | 📱 APK |"
              echo "|-----|------------------|--------|"
              for app in youtube-ex-revanced youtube-ex-dev youtube-ex-morphed; do
                if [ -n "${YOUTUBE_APPS[$app]:-}" ]; then
                  IFS='|' read -ra BADGES <<< "${YOUTUBE_APPS[$app]}"
                  # Only add row if we have both module and apk
                  if [ ${#BADGES[@]} -ge 2 ]; then
                    echo "| **$(get_display_name "$app")** | ${BADGES[0]} | ${BADGES[1]} |"
                  fi
                fi
              done
              echo ""
            fi
            
            # Music Apps
            if [ ${#MUSIC_APPS[@]} -gt 0 ]; then
              echo "### 🎵 YouTube Music Apps"
              echo "| App | 📦 Magisk Module | 📱 APK |"
              echo "|-----|------------------|--------|"
              for app in music-ex-revanced music-ex-dev music-ex-morphed; do
                if [ -n "${MUSIC_APPS[$app]:-}" ]; then
                  IFS='|' read -ra BADGES <<< "${MUSIC_APPS[$app]}"
                  if [ ${#BADGES[@]} -ge 2 ]; then
                    echo "| **$(get_display_name "$app")** | ${BADGES[0]} | ${BADGES[1]} |"
                  fi
                fi
              done
              echo ""
            fi
            
            # Social Media Apps
            if [ ${#SOCIAL_APPS[@]} -gt 0 ]; then
              echo "### 🐦 Social Media Apps"
              echo "| App | 📦 Magisk Module | 📱 APK |"
              echo "|-----|------------------|--------|"
              for app in reddit-ex facebook instagram x-piko x-piko-dev; do
                if [ -n "${SOCIAL_APPS[$app]:-}" ]; then
                  IFS='|' read -ra BADGES <<< "${SOCIAL_APPS[$app]}"
                  if [ ${#BADGES[@]} -ge 2 ]; then
                    echo "| **$(get_display_name "$app")** | ${BADGES[0]} | ${BADGES[1]} |"
                  fi
                fi
              done
              echo ""
            fi
            
            # Music & Media Apps
            if [ ${#MEDIA_APPS[@]} -gt 0 ]; then
              echo "### 🎶 Music & Media Apps"
              echo "| App | 📦 Magisk Module | 📱 APK |"
              echo "|-----|------------------|--------|"
              for app in spotify soundcloud tiktok; do
                if [ -n "${MEDIA_APPS[$app]:-}" ]; then
                  IFS='|' read -ra BADGES <<< "${MEDIA_APPS[$app]}"
                  if [ ${#BADGES[@]} -ge 2 ]; then
                    echo "| **$(get_display_name "$app")** | ${BADGES[0]} | ${BADGES[1]} |"
                  fi
                fi
              done
              echo ""
            fi
            
            # Photo & Creative Apps
            if [ ${#PHOTO_APPS[@]} -gt 0 ]; then
              echo "### 📸 Photo & Creative Apps"
              echo "| App | 📦 Magisk Module | 📱 APK |"
              echo "|-----|------------------|--------|"
              for app in gphotos lightroom; do
                if [ -n "${PHOTO_APPS[$app]:-}" ]; then
                  IFS='|' read -ra BADGES <<< "${PHOTO_APPS[$app]}"
                  if [ ${#BADGES[@]} -ge 2 ]; then
                    echo "| **$(get_display_name "$app")** | ${BADGES[0]} | ${BADGES[1]} |"
                  fi
                fi
              done
            fi
            
            echo "<!-- DOWNLOAD_LINKS_END -->"
          } > readme_links.tmp
          
          # Update README by replacing content between markers
          awk '
            /<!-- DOWNLOAD_LINKS_START -->/ { 
              system("cat readme_links.tmp")
              skip=1
              next
            }
            /<!-- DOWNLOAD_LINKS_END -->/ { skip=0; next }
            !skip { print }
          ' ../README.md > ../README.md.tmp && mv ../README.md.tmp ../README.md
          rm readme_links.tmp

      - uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          branch: update
          skip_checkout: true
          file_pattern: build.md *-update.json
          commit_message: Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          
      - uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          branch: ex
          file_pattern: README.md
          commit_message: "📥 Update download links [skip ci]"
