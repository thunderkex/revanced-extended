name: Build & Release

on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true
      target_arch:
        type: string
        required: false
        default: "arm64-v8a"
        description: "Target architecture (arm64-v8a, armeabi-v7a, x86_64, universal, all)"
      build_lite:
        type: boolean
        required: false
        default: false
        description: "Build lite variants with stripped resources"
      single_release:
        type: boolean
        required: false
        default: true
        description: "Use single mutable release model (replace assets in latest-build)"
      from_configurator:
        type: boolean
        required: false
        default: false
        description: "Triggered by RevPack Configurator"
      enabled_apps:
        type: string
        required: false
        default: ''
        description: "Apps to enable (comma-separated section names, empty = all)"
      disabled_apps:
        type: string
        required: false
        default: ''
        description: "Apps to force-disable (comma-separated)"
      pack_apps:
        type: string
        required: false
        default: ''
        description: "Apps to bundle in RevPack (empty = all enabled)"
      pack_exclude_apps:
        type: string
        required: false
        default: ''
        description: "Apps to exclude from RevPack"
      pack_name:
        type: string
        required: false
        default: ''
        description: "Custom RevPack zip filename (without .zip). Leave blank to use config.toml value."

  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Target architecture'
        required: false
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - universal
          - all
      build_lite:
        description: 'Build lite variants'
        required: false
        default: false
        type: boolean
      single_release:
        description: 'Use single mutable release (replaces latest-build assets)'
        required: false
        default: true
        type: boolean

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Cache downloaded APKs
        uses: actions/cache@v5
        with:
          path: |
            temp/*.apk
            temp/*/*.apk
            temp/*-rv/
          key: apk-downloads-${{ hashFiles('config.toml') }}-${{ github.run_number }}
          restore-keys: |
            apk-downloads-${{ hashFiles('config.toml') }}-
            apk-downloads-

      - name: Cache prebuilt tools
        uses: actions/cache@v5
        with:
          path: |
            bin/
            temp/apkeditor.jar
          key: prebuilt-tools-v1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Update config
        if: ${{ inputs.from_ci }}
        run: |
          if git checkout origin/update build.md 2>/dev/null; then
            UPDATE_CFG=$(./build.sh config.toml --config-update 2>/dev/null || true)
            # Only create config.json if we got valid JSON output
            if [ -n "$UPDATE_CFG" ] && echo "$UPDATE_CFG" | jq empty 2>/dev/null; then
              echo "$UPDATE_CFG" > config.json
            fi
          fi

      - name: Apply app custom configuration
        if: ${{ inputs.enabled_apps != '' || inputs.disabled_apps != '' || inputs.pack_apps != '' || inputs.pack_exclude_apps != '' || inputs.pack_name != '' }}
        env:
          ENABLED_APPS:      ${{ inputs.enabled_apps }}
          DISABLED_APPS:     ${{ inputs.disabled_apps }}
          PACK_APPS:         ${{ inputs.pack_apps }}
          PACK_EXCLUDE_APPS: ${{ inputs.pack_exclude_apps }}
          PACK_NAME:         ${{ inputs.pack_name }}
        run: |
          python3 - <<'PYEOF'
          import os, re

          cfg_path = "config.toml"
          with open(cfg_path, "r") as f:
              lines = f.readlines()

          enabled_raw  = os.environ.get("ENABLED_APPS",      "").strip()
          disabled_raw = os.environ.get("DISABLED_APPS",     "").strip()
          pack_raw     = os.environ.get("PACK_APPS",         "").strip()
          exclude_raw  = os.environ.get("PACK_EXCLUDE_APPS", "").strip()
          pack_name_raw = os.environ.get("PACK_NAME",        "").strip()

          def csv(s):
              return [x.strip() for x in s.split(",") if x.strip()] if s else []

          # None = keep current config.toml state; only disabled_list overrides
          enabled_list  = csv(enabled_raw) if enabled_raw and enabled_raw.lower() != "all" else None
          disabled_list = set(csv(disabled_raw))
          pack_list     = csv(pack_raw)
          exclude_list  = csv(exclude_raw)

          output          = []
          current         = None
          in_main         = True
          pack_written    = False
          exclude_written = False
          pack_name_written = False

          section_re   = re.compile(r"^\[([^\]]+)\]")
          enabled_re   = re.compile(r"^(\s*enabled\s*=\s*)(true|false)(.*)")
          pack_re      = re.compile(r"^(\s*pack-apps\s*=\s*)")
          excl_re      = re.compile(r"^(\s*pack-exclude-apps\s*=\s*)")
          pack_name_re = re.compile(r"^(\s*pack-name\s*=\s*)")

          for line in lines:
              sec_m = section_re.match(line.rstrip())
              if sec_m:
                  in_main = False
                  current = sec_m.group(1)
                  output.append(line)
                  continue
              if in_main:
                  if pack_re.match(line):
                      val = '"' + ', '.join(pack_list) + '"' if pack_list else '""'
                      output.append(f'pack-apps = {val}\n')
                      pack_written = True
                      continue
                  if excl_re.match(line):
                      val = '"' + ', '.join(exclude_list) + '"' if exclude_list else '""'
                      output.append(f'pack-exclude-apps = {val}\n')
                      exclude_written = True
                      continue
                  if pack_name_re.match(line) and pack_name_raw:
                      output.append(f'pack-name = "{pack_name_raw}"\n')
                      pack_name_written = True
                      continue
                  output.append(line)
                  continue
              en_m = enabled_re.match(line)
              if en_m and current is not None:
                  if current in disabled_list:
                      new_val = "false"
                  elif enabled_list is None:
                      new_val = en_m.group(2)
                  elif current in enabled_list:
                      new_val = "true"
                  else:
                      new_val = "false"
                  output.append(f"{en_m.group(1)}{new_val}{en_m.group(3)}\n")
                  continue
              output.append(line)

          if not pack_written or not exclude_written:
              final = []
              for line in output:
                  final.append(line)
                  if "combine-modules" in line and "=" in line and not pack_written:
                      val = '"' + ', '.join(pack_list) + '"' if pack_list else '""'
                      final.append(f'pack-apps = {val}\n')
                      pack_written = True
                      val2 = '"' + ', '.join(exclude_list) + '"' if exclude_list else '""'
                      final.append(f'pack-exclude-apps = {val2}\n')
                      exclude_written = True
              output = final

          with open(cfg_path, "w") as f:
              f.writelines(output)

          # picks up pack-name when it prefers config.json over config.toml.
          import json as _json
          cfg_json_path = "config.json"
          if pack_name_raw and os.path.exists(cfg_json_path):
              with open(cfg_json_path, "r") as f:
                  cfg_json = _json.load(f)
              cfg_json["pack-name"] = pack_name_raw
              with open(cfg_json_path, "w") as f:
                  _json.dump(cfg_json, f, indent=2)
              print(f"Also updated config.json: pack-name -> {pack_name_raw}")

          print("Applied custom app configuration to config.toml")
          print(f"  enabled:      {enabled_raw or 'all'}")
          print(f"  disabled:     {disabled_raw or '(none)'}")
          print(f"  pack-apps:    {pack_raw or '(all enabled)'}")
          print(f"  pack-exclude: {exclude_raw or '(none)'}")
          print(f"  pack-name:    {pack_name_raw or '(from config.toml)'}")
          PYEOF

      - name: Get next version code
        id: next_ver_code
        run: |
          echo "NEXT_VER_CODE=$(date +%Y%m%d%H%M)" >> $GITHUB_OUTPUT

      - name: Build modules/APKs
        run: |
          # Set architecture from input
          export TARGET_ARCH="${{ inputs.target_arch || 'arm64-v8a' }}"
          export BUILD_LITE="${{ inputs.build_lite || 'false' }}"

          if [ -f "config.json" ]; then
            ./build.sh config.json
          else
            ./build.sh config.toml
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}

      - name: Build lite variants
        if: ${{ inputs.build_lite == true && inputs.from_configurator != true }}
        env:
          BUILD_DIR: "build"
          LITE_BUILD_MODULES: "true"
          LITE_LANGUAGES: "en"
          LITE_DPI: "xxhdpi"
          LITE_COMPRESSION: "9"
        run: |
          if [ -d "build" ] && command -v ./scripts/utilities/build-lite.sh &>/dev/null; then
            ./scripts/utilities/build-lite.sh
          fi

      - name: Split APKs by architecture
        if: ${{ inputs.target_arch == 'all' && inputs.from_configurator != true }}
        run: |
          if command -v ./scripts/utilities/split-apk.sh &>/dev/null; then
            ./scripts/utilities/split-apk.sh
          fi

      - name: Get output
        id: get_output
        run: |
          echo "DATE=$(date +%y.%m.%d)" >> "$GITHUB_OUTPUT"
          
          # Generate architecture suffix for release name
          ARCH="${{ inputs.target_arch || 'arm64-v8a' }}"
          if [ "$ARCH" = "all" ]; then
            ARCH_SUFFIX=""
          else
            ARCH_SUFFIX=" [$ARCH]"
          fi
          echo "ARCH_SUFFIX=$ARCH_SUFFIX" >> "$GITHUB_OUTPUT"
          
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp

      - name: Get Date
        id: date
        run: |
          echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts with architecture
        run: |
          cd build
          ARCH="${{ inputs.target_arch || 'arm64-v8a' }}"
          FROM_CONFIGURATOR="${{ inputs.from_configurator || 'false' }}"
          PACK_PREFIX="${{ inputs.pack_name || 'revpack' }}"
          for f in *.apk *.zip; do
            [ -f "$f" ] || continue
            if [[ "$f" == "${PACK_PREFIX}-"* ]]; then
              if [ "$FROM_CONFIGURATOR" = "true" ]; then
                TS=$(date +%Y%m%d%H%M)
                base="${f%.zip}"
                mv "$f" "${base}-custom-${TS}.zip" 2>/dev/null || true
              fi
              continue
            fi
            # Skip if already has architecture in name
            if [[ "$f" != *"$ARCH"* ]] && [ "$ARCH" != "universal" ] && [ "$ARCH" != "all" ]; then
              base="${f%.*}"
              ext="${f##*.}"
              mv "$f" "${base}-${ARCH}.${ext}" 2>/dev/null || true
            fi
          done

      - name: Keep RevPack only (Configurator builds)
        if: ${{ inputs.from_configurator == true }}
        run: |
          cd build
          PACK_PREFIX="${{ inputs.pack_name || 'revpack' }}"
          for f in *; do
            [ -f "$f" ] || continue
            [[ "$f" == "${PACK_PREFIX}-"* ]] && continue
            echo "Removing non-revpack artifact: $f"
            rm -f "$f"
          done
          echo "Remaining files:"
          ls -lh || true

      - name: Generate changelog
        id: changelog
        if: ${{ inputs.from_configurator != true }}
        run: |
          chmod +x ./scripts/utilities/generate-changelog.sh 2>/dev/null || true
          if [ -f "./scripts/utilities/generate-changelog.sh" ]; then
            RELEASE_NOTES=$(./scripts/utilities/generate-changelog.sh release-notes "${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}")
            # Save to file for multi-line output
            echo "$RELEASE_NOTES" > release_notes.md
            
            # Also generate full changelog
            ./scripts/utilities/generate-changelog.sh generate "${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}" CHANGELOG.md
          fi
          
          # Fallback to build.md if script not available
          if [ ! -f "release_notes.md" ]; then
            cp build.md release_notes.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Single Release (latest-build)
        if: ${{ inputs.single_release != false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: "latest-build"
          RELEASE_NAME: "ReVanced Extended - Latest Build"
          BUILD_DIR: "build"
          PRESERVE_REVPACK: ${{ inputs.from_configurator && 'true' || 'false' }}
          FROM_CONFIGURATOR: ${{ inputs.from_configurator && 'true' || 'false' }}
          PACK_PREFIX: ${{ inputs.pack_name || 'revpack' }}
        run: |
          chmod +x ./scripts/release/post-build-release.sh 2>/dev/null || true
          if [ -f "./scripts/release/post-build-release.sh" ]; then
            ./scripts/release/post-build-release.sh
          else
            echo "::warning::post-build-release.sh not found, falling back to inline release"
            # Inline fallback - create/update single release
            
            # Check if release exists
            if ! gh release view "latest-build" &>/dev/null; then
              echo "Creating latest-build release..."
              gh release create "latest-build" \
                --title "ReVanced Extended - Latest Build" \
                --notes "Initializing..." \
                --latest
            fi
            
            if [ "${FROM_CONFIGURATOR:-false}" = "true" ]; then
              echo "Configurator build — preserving all existing release assets"
            else
              echo "Cleaning existing assets..."
              ASSETS_JSON=$(gh api repos/${{ github.repository }}/releases/tags/latest-build 2>/dev/null || echo '{}')
              while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
                [ -z "$ASSET_ID" ] || [ "$ASSET_ID" = "null" ] && continue
                if [[ "$ASSET_NAME" == "${PACK_PREFIX:-revpack}-"* ]]; then
                  echo "Preserving existing revpack asset: $ASSET_NAME"
                  continue
                fi
                gh api -X DELETE repos/${{ github.repository }}/releases/assets/$ASSET_ID || true
              done < <(echo "$ASSETS_JSON" | jq -r '.assets[]? | [.id, .name] | @tsv' 2>/dev/null || true)
            fi
            
            # Upload new assets
            echo "Uploading new assets..."
            if [ "${FROM_CONFIGURATOR:-false}" != "true" ]; then
              for file in build/*.apk build/*.zip; do
                [ -f "$file" ] || continue
                gh release upload "latest-build" "$file" --clobber || true
              done
            else
              for file in build/*.zip; do
                [ -f "$file" ] || continue
                gh release upload "latest-build" "$file" --clobber || true
              done
            fi
            
            # Update release body (skip when from configurator)
            if [ "${FROM_CONFIGURATOR:-false}" != "true" ]; then
              gh release edit "latest-build" \
                --title "ReVanced Extended - Latest Build" \
                --notes-file release_notes.md \
                --latest
            fi
          fi

      - name: Upload to versioned release (Legacy)
        if: ${{ inputs.single_release == false && inputs.from_configurator != true }}
        uses: svenstaro/upload-release-action@v2
        with:
          body_path: release_notes.md
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./build/*
          release_name: ReVanced eXtended v${{ steps.get_output.outputs.DATE }}${{ steps.get_output.outputs.ARCH_SUFFIX }}
          tag: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          file_glob: true
          overwrite: true
          prerelease: false
          make_latest: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ inputs.target_arch || 'arm64-v8a' }}-${{ github.run_number }}
          path: ./build/*
          retention-days: 7

      - name: Commit configurator revpack update JSON
        if: ${{ inputs.from_configurator == true }}
        env:
          PACK_PREFIX: ${{ inputs.pack_name || 'revpack' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          SINGLE_RELEASE: ${{ inputs.single_release }}
        run: |
          cd build
          CUSTOM_ZIP=$(ls ${PACK_PREFIX}-*-custom-*.zip 2>/dev/null | sort -r | head -1 || true)
          if [ -z "$CUSTOM_ZIP" ]; then
            echo "No custom revpack found, skipping update JSON"
            exit 0
          fi
          VER=$(unzip -p "$CUSTOM_ZIP" module.prop 2>/dev/null | grep '^version=' | cut -d= -f2 || echo "v${NEXT_VER_CODE}")
          if [ "${SINGLE_RELEASE:-true}" != "false" ]; then
            DLURL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/latest-build/${CUSTOM_ZIP}"
          else
            DLURL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${NEXT_VER_CODE}/${CUSTOM_ZIP}"
          fi
          UPDATE_JSON_NAME="${PACK_PREFIX}-update.json"
          printf '{"version":"%s","versionCode":%s,"zipUrl":"%s","changelog":"https://raw.githubusercontent.com/%s/update/build.md"}\n' \
            "$VER" "$NEXT_VER_CODE" "$DLURL" "$GITHUB_REPOSITORY" \
            > "/tmp/${UPDATE_JSON_NAME}"
          cd ..
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f "/tmp/${UPDATE_JSON_NAME}" "./${UPDATE_JSON_NAME}"

      - uses: stefanzweifel/git-auto-commit-action@v7.1.0
        if: ${{ inputs.from_configurator == true }}
        with:
          branch: update
          skip_checkout: true
          file_pattern: '*-update.json'
          commit_message: Bump configurator revpack ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}

      - name: Update changelog and update json
        id: update_config
        if: ${{ inputs.from_configurator != true }}
        env:
          SINGLE_RELEASE: ${{ inputs.single_release }}
        run: |
          # Save CHANGELOG.md before switching branches
          if [ -f "CHANGELOG.md" ]; then
            cp -f CHANGELOG.md /tmp/CHANGELOG.md
          fi
          
          git switch -f update || git switch --orphan update

          if [ -s build.md ]; then
            python3 - <<'PYEOF'
          with open('build.md') as f:
              old = [l.rstrip() for l in f if l.strip()]
          with open('build.tmp') as f:
              new = [l.rstrip() for l in f if l.strip()]

          rebuilt = {l.split('/')[0][9:] for l in new if l.startswith('Patches: ')}
          new_apps = {l.split(':')[0] for l in new if not l.startswith('Patches: ')}

          kept = []
          i = 0
          while i < len(old):
              line = old[i]
              if line.startswith('Patches: '):
                  src = line.split('/')[0][9:]
                  has_app = i + 1 < len(old) and not old[i + 1].startswith('Patches: ')
                  app_name = old[i + 1].split(':')[0] if has_app else None
                  
                  if src not in rebuilt and (app_name is None or app_name not in new_apps):
                      kept.append(line)
                      if has_app:
                          kept.append(old[i + 1])
                  i += 2 if has_app else 1
              else:
                  kept.append(line)
                  i += 1

          with open('build.md', 'w') as f:
              f.write('\n'.join(kept + new) + '\n')
          PYEOF
          else
            cp -f build.tmp build.md
          fi
          
          if [ -f "/tmp/CHANGELOG.md" ]; then
            cp -f /tmp/CHANGELOG.md ./CHANGELOG.md
          fi
          
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md\"
          }"
          }

          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *.zip; do
            [ "$OUTPUT" = "*.zip" ] && continue
            # Skip custom configurator revpacks — they must not overwrite individual
            [[ "$OUTPUT" == *-custom-*.zip ]] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            
            # Use single-release tag or versioned tag based on mode
            if [ "${SINGLE_RELEASE:-true}" != "false" ]; then
              DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/latest-build/${OUTPUT}"
            else
              DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            fi
            get_update_json "$VER" "$DLURL" >"../$UPDATE_JSON"
          done
          cd ..

          find . -name "*-update.json" | grep . || : >dummy-update.json

      - name: Report to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SINGLE_RELEASE: ${{ inputs.single_release }}
        if: ${{ env.TG_TOKEN != null && inputs.from_configurator != true }}
        run: |
          cd build || { echo "build folder not found"; exit 1; }

          NL=$'\n'
          APKS=""
          MODULES=""
          REVPACK=""
          ARCH="${{ inputs.target_arch || 'arm64-v8a' }}"
          
          # Use appropriate release tag
          if [ "${SINGLE_RELEASE:-true}" != "false" ]; then
            RELEASE_TAG="latest-build"
          else
            RELEASE_TAG="${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
          fi
          
          for OUTPUT in *; do
            DL_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${RELEASE_TAG}/${OUTPUT}"
            if [[ $OUTPUT = revpack-* ]]; then
              REVPACK+="${NL}📦[${OUTPUT}](${DL_URL})"
            elif [[ $OUTPUT = *.apk ]]; then
              APKS+="${NL}📦[${OUTPUT}](${DL_URL})"
            elif [[ $OUTPUT = *.zip ]]; then
              MODULES+="${NL}📦[${OUTPUT}](${DL_URL})"
            fi
          done
          MODULES=${MODULES#"$NL"}
          APKS=${APKS#"$NL"}
          REVPACK=${REVPACK#"$NL"}

          BODY="$(sed 's/^\* \*\*/↪ \*\*/g; s/^\* `/↪ \*\*/g; s/`/\*/g; s/^\* /\↪/g; s/\*\*/\*/g; s/###//g; s/^- /↪ /g; /^==/d;' ../build.md)"
          LINE="━━━━━━━━━━━━━━━━━━━━"

            RECENT=""
            while IFS='|' read -r hash subject date; do
            RECENT+="${NL}↪ ${subject} (${date})"
            done < <(git log origin/ex --format="%h|%s|%ad" --date=short 2>/dev/null | grep -v "GitHub Action\|skip ci" | head -5)
            RECENT=${RECENT#"$NL"}

          # Build optional RevPack section (LINE must be defined first)
          REVPACK_SECTION=""
          if [ -n "$REVPACK" ]; then
            REVPACK_SECTION="${NL}${NL}📦 *RevPack (All-in-One Module):*${NL}${REVPACK}${NL}${LINE}"
          fi
          MSG="🚀 *ReVanced Extended - New Build*${NL}${LINE}${NL}${NL}📝 *Recent Changes:*${NL}${RECENT}${NL}${NL}🏗️ *Architecture:* \`${ARCH}\`${NL}${NL}${LINE}${NL}📥 *Downloads*${REVPACK_SECTION}${NL}${NL}🧩 *Magisk Modules:*${NL}${MODULES}${NL}${NL}📱 *APK Files:*${NL}${APKS}${NL}${LINE}"
          echo "'$MSG'"
          MSG=${MSG:0:9450}
          POST="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          curl -X POST --data-urlencode "parse_mode=Markdown" --data-urlencode "disable_web_page_preview=true" --data-urlencode "text=${MSG}" --data-urlencode "message_thread_id=26772" --data-urlencode "chat_id=${CHAT_ID}" "$POST"

      - uses: stefanzweifel/git-auto-commit-action@v7.1.0
        if: ${{ inputs.from_configurator != true }}
        with:
          branch: update
          skip_checkout: true
          file_pattern: build.md CHANGELOG.md *-update.json
          commit_message: Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
