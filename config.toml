# ====================================
# ReVanced Extended Build Configuration
# ====================================
# See CONFIG.md for detailed documentation

# === Global Build Settings ===
enable-magisk-update = true
parallel-jobs = 1
compression-level = 9
riplib = true
remove-rv-integrations-checks = true

# === Architecture Settings ===
# Supported: "arm64-v8a", "armeabi-v7a", "x86_64", "universal", "all", "both"
# "all" builds all architectures separately
# "both" builds arm64-v8a and armeabi-v7a
# "universal" keeps all architectures in single APK
default-arch = "arm64-v8a"

# === Lite Build Settings ===
# When enabled, creates stripped versions with reduced resources
build-lite = false
# Also build lite versions of Magisk modules
lite-build-modules = false
# Languages to keep in lite builds (comma-separated, e.g., "en,es,zh")
lite-languages = "en"
# DPIs to keep in lite builds (e.g., "xxhdpi,xxxhdpi" or "nodpi")
lite-dpi = "xxhdpi"
# Compression level for lite builds (0-9, higher = smaller but slower)
lite-compression = 9

# === Performance Settings ===
# Download timeout in seconds
download-timeout = 30
# Retry failed downloads
download-retries = 3
# Continue building other apps if one fails
continue-on-error = true

# ====================================
